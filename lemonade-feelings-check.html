<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feelings Check</title>
<link rel="alternate" type="application/json+oembed" href="https://sulkastudio.github.io/Notion/oembed-lemonade-feelings-check.json" title="Feelings Check">
<style>
  :root{
    --cream:#f6ecd9; --cream-deep:#ead6b0;
    --sage:#7f9a63; --sage-deep:#4f6a3f;
    --terracotta:#d98872; --terracotta-deep:#b1573f;
    --wood:#8a6238; --ink:#3e2e22; --yellow:#eab53f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --cream:#2a2117; --cream-deep:#382c1e;
      --sage:#7f9a63; --sage-deep:#a9c48a;
      --terracotta:#d98872; --terracotta-deep:#e6a891;
      --wood:#b98956; --ink:#f3e7d2; --yellow:#eab53f;
    }
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    padding:12px;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  .card{
    position:relative;
    width:100%; max-width:1200px;
    background:var(--cream);
    border:3px solid var(--ink);
    border-radius:18px;
    padding:18px 22px 28px;
    box-shadow:0 3px 0 var(--ink), 0 5px 10px rgba(62,46,34,0.16);
    display:flex; flex-direction:column; gap:6px;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; inset:0;
    background-image:radial-gradient(var(--cream-deep) 1px, transparent 1px);
    background-size:14px 14px; opacity:.5; pointer-events:none;
  }
  .row-top{ display:flex; align-items:center; justify-content:space-between; z-index:1; }
  .label{
    font-size:clamp(10px,1.8vw,14px); letter-spacing:.14em; text-transform:uppercase;
    color:var(--sage-deep); font-weight:700;
  }
  .icon{ width:clamp(22px,3.6vw,34px); height:clamp(22px,3.6vw,34px); image-rendering:pixelated; }
  .diagram{ width:100%; height:auto; z-index:1; }
  .diagram text{
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
    fill:var(--ink);
  }
  .diagram .edge-label{ fill:var(--sage-deep); font-weight:700; }
  .diagram .node-text{ font-weight:700; }
  .diagram .node-text.on-accent{ fill:var(--cream); }
  .diagram path.line{ stroke:var(--wood); stroke-width:2; fill:none; }
  .footer{
    font-size:clamp(11px,1.9vw,15px); color:var(--wood); font-style:italic; z-index:1;
    text-align:center; margin-top:8px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="row-top">
      <span class="label">Little check-in</span>
      <svg class="icon" viewBox="0 0 16 16">
        <rect x="3" y="2" width="2" height="2" fill="#8a8a8a"/>
        <rect x="11" y="2" width="2" height="2" fill="#8a8a8a"/>
        <rect x="2" y="6" width="1" height="4" fill="#8a8a8a"/>
        <rect x="13" y="6" width="1" height="4" fill="#8a8a8a"/>
        <rect x="3" y="4" width="10" height="8" fill="#a3a3a3"/>
        <rect x="3" y="7" width="10" height="3" fill="#3a352f"/>
        <rect x="5" y="8" width="2" height="2" fill="#fdf8ee"/>
        <rect x="9" y="8" width="2" height="2" fill="#fdf8ee"/>
        <rect x="7" y="10" width="2" height="1" fill="#2a211a"/>
      </svg>
    </div>

    <svg class="diagram" viewBox="0 0 630 410" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="var(--wood)"/>
        </marker>
      </defs>

      <!-- connectors -->
      <path class="line" d="M320,46 L320,58" marker-end="url(#arrow)"/>
      <path class="line" d="M320,126 L320,145 L130,145 L130,172" marker-end="url(#arrow)"/>
      <path class="line" d="M320,126 L320,177" marker-end="url(#arrow)"/>
      <path class="line" d="M320,126 L320,145 L510,145 L510,177" marker-end="url(#arrow)"/>
      <path class="line" d="M130,248 L130,270 L55,270 L55,299" marker-end="url(#arrow)"/>
      <path class="line" d="M130,248 L130,270 L205,270 L205,299" marker-end="url(#arrow)"/>
      <path class="line" d="M320,223 L320,355"/>
      <path class="line" d="M510,223 L510,355"/>
      <path class="line" d="M55,341 L55,355"/>
      <path class="line" d="M205,341 L205,355"/>
      <path class="line" d="M55,355 L510,355"/>
      <path class="line" d="M320,355 L320,359" marker-end="url(#arrow)"/>

      <!-- edge labels -->
      <rect x="192" y="132" width="46" height="16" fill="var(--cream)"/>
      <text class="edge-label" x="215" y="144" font-size="11" text-anchor="middle">Meh...</text>
      <rect x="298" y="152" width="34" height="16" fill="var(--cream)"/>
      <text class="edge-label" x="315" y="164" font-size="11" text-anchor="middle">Yes!</text>
      <rect x="388" y="132" width="62" height="16" fill="var(--cream)"/>
      <text class="edge-label" x="419" y="144" font-size="11" text-anchor="middle">Rough one</text>
      <rect x="58" y="257" width="52" height="16" fill="var(--cream)"/>
      <text class="edge-label" x="84" y="269" font-size="11" text-anchor="middle">Kind of</text>
      <rect x="150" y="257" width="72" height="16" fill="var(--cream)"/>
      <text class="edge-label" x="186" y="269" font-size="11" text-anchor="middle">Not a clue</text>

      <!-- start pill -->
      <rect x="190" y="6" width="260" height="40" rx="20" fill="var(--cream-deep)" stroke="var(--ink)" stroke-width="2.5"/>
      <text class="node-text" x="320" y="31" font-size="13" text-anchor="middle">How am I feeling right now?</text>

      <!-- diamond1: Good day? -->
      <polygon points="320,58 390,92 320,126 250,92" fill="var(--cream)" stroke="var(--ink)" stroke-width="2.5"/>
      <text class="node-text" x="320" y="97" font-size="12.5" text-anchor="middle">Good day?</text>

      <!-- diamond2: Can I explain why? -->
      <polygon points="130,172 208,210 130,248 52,210" fill="var(--cream)" stroke="var(--ink)" stroke-width="2.5"/>
      <text class="node-text" x="130" y="205" font-size="12" text-anchor="middle">Can I explain</text>
      <text class="node-text" x="130" y="219" font-size="12" text-anchor="middle">why?</text>

      <!-- yes-box -->
      <rect x="215" y="177" width="210" height="46" rx="10" fill="var(--sage)" stroke="var(--ink)" stroke-width="2"/>
      <text class="node-text on-accent" x="320" y="196" font-size="12.5" text-anchor="middle">Nice! Let's remember</text>
      <text class="node-text on-accent" x="320" y="212" font-size="12.5" text-anchor="middle">this one</text>

      <!-- rough-box -->
      <rect x="415" y="177" width="190" height="46" rx="10" fill="var(--terracotta)" stroke="var(--ink)" stroke-width="2"/>
      <text class="node-text on-accent" x="510" y="196" font-size="12.5" text-anchor="middle">That's exactly why</text>
      <text class="node-text on-accent" x="510" y="212" font-size="12.5" text-anchor="middle">you're here</text>

      <!-- kindof-box -->
      <rect x="0" y="299" width="110" height="42" rx="10" fill="var(--cream-deep)" stroke="var(--ink)" stroke-width="2"/>
      <text class="node-text" x="55" y="325" font-size="11.5" text-anchor="middle">Worth digging into</text>

      <!-- noclue-box -->
      <rect x="130" y="299" width="150" height="42" rx="10" fill="var(--terracotta)" stroke="var(--ink)" stroke-width="2"/>
      <text class="node-text on-accent" x="205" y="315" font-size="11.5" text-anchor="middle">Even more reason</text>
      <text class="node-text on-accent" x="205" y="330" font-size="11.5" text-anchor="middle">to dig in</text>

      <!-- CTA -->
      <rect x="210" y="359" width="220" height="42" rx="10" fill="var(--sage)" stroke="var(--ink)" stroke-width="2.5"/>
      <text class="node-text on-accent" x="320" y="385" font-size="13" text-anchor="middle">📝 Go journal about it</text>
    </svg>

    <div class="footer">(No wrong answers. The raccoon doesn't judge.)</div>
  </div>
</body>
</html>
