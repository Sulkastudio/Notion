<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feelings Check</title>
<link rel="alternate" type="application/json+oembed" href="https://sulkastudio.github.io/Notion/oembed-lemonade-feelings-check.json" title="Feelings Check">
<style>
  :root{
    --cream:#f6ecd9; --cream-deep:#ead6b0;
    --sage:#7f9a63; --sage-deep:#4f6a3f;
    --terracotta:#d98872; --terracotta-deep:#b1573f;
    --wood:#8a6238; --ink:#3e2e22; --yellow:#eab53f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --cream:#2a2117; --cream-deep:#382c1e;
      --sage:#7f9a63; --sage-deep:#a9c48a;
      --terracotta:#d98872; --terracotta-deep:#e6a891;
      --wood:#b98956; --ink:#f3e7d2; --yellow:#eab53f;
    }
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  .card{
    position:relative;
    width:100%; max-width:460px;
    background:var(--cream);
    border:3px solid var(--ink);
    border-radius:18px;
    padding:20px 24px;
    box-shadow:0 4px 0 var(--ink), 0 10px 20px rgba(62,46,34,0.15);
    display:flex; flex-direction:column; gap:12px;
    overflow:hidden;
    min-height:190px;
  }
  .card::before{
    content:"";
    position:absolute; inset:0;
    background-image:radial-gradient(var(--cream-deep) 1px, transparent 1px);
    background-size:14px 14px; opacity:.5; pointer-events:none;
  }
  .row-top{ display:flex; align-items:center; justify-content:space-between; z-index:1; }
  .label{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--sage-deep); font-weight:700;
  }
  .icon{ width:28px; height:28px; image-rendering:pixelated; }
  .question{
    font-size:19px; font-weight:800; color:var(--ink); z-index:1;
    line-height:1.3; text-wrap:balance;
  }
  .choices{ display:flex; gap:8px; flex-wrap:wrap; z-index:1; }
  .choice-btn{
    border:2px solid var(--ink); background:var(--cream-deep); color:var(--ink);
    font-family:inherit; font-size:13.5px; font-weight:700;
    padding:8px 16px; border-radius:20px; cursor:pointer;
    transition:transform .12s ease, background .12s ease, color .12s ease;
  }
  .choice-btn:hover{ transform:translateY(-2px); }
  .choice-btn.positive:hover{ background:var(--sage); color:var(--cream); }
  .choice-btn.neutral:hover{ background:var(--wood); color:var(--cream); }
  .choice-btn.negative:hover{ background:var(--terracotta); color:var(--cream); }
  .answer{
    font-size:16px; font-weight:700; color:var(--ink); z-index:1;
    line-height:1.4;
  }
  .cta{
    display:flex; align-items:center; gap:8px; z-index:1;
    background:var(--sage); color:var(--cream);
    font-weight:800; font-size:14.5px;
    padding:10px 16px; border-radius:12px; width:fit-content;
  }
  .footer{
    font-size:12px; color:var(--wood); font-style:italic; z-index:1;
    margin-top:auto;
  }
  .again{
    font-size:12px; color:var(--sage-deep); font-weight:700; z-index:1;
    cursor:pointer; background:none; border:none; padding:0; text-align:left;
    font-family:inherit; width:fit-content;
  }
  .again:hover{ text-decoration:underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="row-top">
      <span class="label">Little check-in</span>
      <svg class="icon" viewBox="0 0 16 16">
        <rect x="3" y="2" width="2" height="2" fill="#8a8a8a"/>
        <rect x="11" y="2" width="2" height="2" fill="#8a8a8a"/>
        <rect x="2" y="6" width="1" height="4" fill="#8a8a8a"/>
        <rect x="13" y="6" width="1" height="4" fill="#8a8a8a"/>
        <rect x="3" y="4" width="10" height="8" fill="#a3a3a3"/>
        <rect x="3" y="7" width="10" height="3" fill="#3a352f"/>
        <rect x="5" y="8" width="2" height="2" fill="#fdf8ee"/>
        <rect x="9" y="8" width="2" height="2" fill="#fdf8ee"/>
        <rect x="7" y="10" width="2" height="1" fill="#2a211a"/>
      </svg>
    </div>

    <div id="stage"></div>
  </div>

<script>
const STAGES = {
  start: {
    question: "How am I feeling right now?",
    choices: [
      { label: "Yes!", cls: "positive", next: "yes" },
      { label: "Meh...", cls: "neutral", next: "meh" },
      { label: "Rough one", cls: "negative", next: "rough" }
    ]
  },
  meh: {
    question: "Can I explain why?",
    choices: [
      { label: "Kind of", cls: "neutral", next: "end_kindof" },
      { label: "Not a clue", cls: "negative", next: "end_noclue" }
    ]
  },
  yes: { end: true, answer: "Nice! Let's remember this one." },
  rough: { end: true, answer: "That's exactly why you're here." },
  end_kindof: { end: true, answer: "Worth digging into." },
  end_noclue: { end: true, answer: "Even more reason to dig in." }
};

function renderStage(key){
  const s = STAGES[key];
  const stage = document.getElementById('stage');

  if (!s.end){
    stage.innerHTML = `
      <div class="question">${s.question}</div>
      <div class="choices">
        ${s.choices.map(c => `<button class="choice-btn ${c.cls}" data-next="${c.next}">${c.label}</button>`).join('')}
      </div>
    `;
    stage.querySelectorAll('.choice-btn').forEach(btn => {
      btn.addEventListener('click', () => renderStage(btn.dataset.next));
    });
    return;
  }

  stage.innerHTML = `
    <div class="answer">${s.answer}</div>
    <div class="cta">📝 Go journal about it</div>
    <div class="footer">(No wrong answers. The raccoon doesn't judge.)</div>
    <button class="again">↺ Ask me again</button>
  `;
  stage.querySelector('.again').addEventListener('click', () => renderStage('start'));
}

renderStage('start');
</script>
</body>
</html>
