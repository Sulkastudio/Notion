<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Weather</title>
<style>
  :root{
    --cream:#f6ecd9; --cream-deep:#ead6b0;
    --sage:#7f9a63; --sage-deep:#4f6a3f;
    --terracotta:#d98872; --terracotta-deep:#b1573f;
    --wood:#8a6238; --ink:#3e2e22; --yellow:#eab53f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --cream:#2a2117; --cream-deep:#382c1e;
      --sage:#7f9a63; --sage-deep:#a9c48a;
      --terracotta:#d98872; --terracotta-deep:#e6a891;
      --wood:#b98956; --ink:#f3e7d2; --yellow:#eab53f;
    }
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    padding:12px;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  .card{
    position:relative;
    width:100%; max-width:none;
    background:var(--cream);
    border:3px solid var(--ink);
    border-radius:18px;
    padding:clamp(16px,4vw,28px) clamp(18px,5vw,34px);
    box-shadow:0 3px 0 var(--ink), 0 5px 10px rgba(62,46,34,0.16);
    display:flex; flex-direction:column; gap:10px;
    overflow:hidden;
    min-height:150px;
  }
  .card::before{
    content:"";
    position:absolute; inset:0;
    background-image:radial-gradient(var(--cream-deep) 1px, transparent 1px);
    background-size:14px 14px; opacity:.5; pointer-events:none;
  }
  .row-top{ display:flex; align-items:center; justify-content:space-between; z-index:1; }
  .label{
    font-size:clamp(10px,2.2vw,14px); letter-spacing:.14em; text-transform:uppercase;
    color:var(--sage-deep); font-weight:700;
    cursor:pointer; width:fit-content;
  }
  .label:hover{ text-decoration:underline; }
  .main{ display:flex; align-items:center; gap:16px; z-index:1; }
  .icon{ width:clamp(44px,9vw,80px); height:clamp(44px,9vw,80px); image-rendering:pixelated; flex-shrink:0; }
  .temp{
    font-family:"SF Mono","Courier New",monospace;
    font-weight:800; font-size:clamp(30px,8.5vw,68px); color:var(--ink); line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .cond{ font-size:clamp(12px,2.8vw,17px); color:var(--wood); font-weight:600; margin-top:2px; }
  .place{ font-size:clamp(11px,2.4vw,15px); color:var(--sage-deep); font-weight:700; z-index:1; }
  .lohi{ font-size:clamp(10.5px,2.2vw,14px); color:var(--wood); z-index:1; }
  .panel{
    display:none; gap:8px; align-items:center; z-index:1;
    background:var(--cream-deep); border-radius:10px; padding:10px 12px; margin-top:2px;
  }
  .panel.open{ display:flex; }
  .panel input{
    flex:1; font-family:inherit; font-size:13px; border:2px solid var(--wood);
    border-radius:8px; padding:5px 8px; background:var(--cream); color:var(--ink);
  }
  .panel button{
    border:none; background:var(--sage); color:var(--cream);
    font-size:12px; font-weight:700; padding:6px 12px; border-radius:8px; cursor:pointer;
  }
  .panel button:hover{ background:var(--sage-deep); }
  .msg{ font-size:13px; color:var(--wood); z-index:1; }
</style>
</head>
<body>
  <div class="card">
    <div class="row-top">
      <span class="label" id="placeLabel">Weather</span>
    </div>
    <div class="main">
      <svg class="icon" id="wxIcon" viewBox="0 0 16 16"></svg>
      <div>
        <div class="temp" id="temp">--°</div>
        <div class="cond" id="cond">Loading...</div>
      </div>
    </div>
    <div class="lohi" id="lohi"></div>

    <div class="panel" id="panel">
      <input type="text" id="cityInput" placeholder="Try: Paris, Lyon, Marseille...">
      <button id="saveBtn">Go</button>
    </div>
  </div>

<script>
const CITY_KEY = 'cozy-weather-city';
const LOC_KEY = 'cozy-weather-loc';
const DEFAULT_CITY = 'Paris';

function safeGet(key){ try { return localStorage.getItem(key); } catch(e){ return null; } }
function safeSet(key, val){ try { localStorage.setItem(key, val); } catch(e){} }

const icons = {
  sun: `<rect x="6" y="1" width="4" height="2" fill="#eab53f"/><rect x="6" y="13" width="4" height="2" fill="#eab53f"/><rect x="1" y="6" width="2" height="4" fill="#eab53f"/><rect x="13" y="6" width="2" height="4" fill="#eab53f"/><rect x="3" y="3" width="2" height="2" fill="#eab53f"/><rect x="11" y="3" width="2" height="2" fill="#eab53f"/><rect x="3" y="11" width="2" height="2" fill="#eab53f"/><rect x="11" y="11" width="2" height="2" fill="#eab53f"/><rect x="4" y="4" width="8" height="8" fill="#eab53f"/>`,
  cloud: `<rect x="3" y="7" width="10" height="4" fill="#e9e4f5"/><rect x="4" y="6" width="8" height="1" fill="#e9e4f5"/><rect x="5" y="5" width="4" height="1" fill="#e9e4f5"/><rect x="2" y="11" width="12" height="1" fill="#cfc8e0"/>`,
  partly: `<rect x="2" y="9" width="7" height="1" fill="#eab53f"/><rect x="3" y="3" width="1" height="1" fill="#eab53f"/><rect x="0" y="6" width="1" height="1" fill="#eab53f"/><rect x="3" y="6" width="4" height="4" fill="#eab53f"/><rect x="6" y="6" width="9" height="5" fill="#e9e4f5"/><rect x="7" y="5" width="6" height="1" fill="#e9e4f5"/><rect x="5" y="10" width="11" height="1" fill="#cfc8e0"/>`,
  rain: `<rect x="3" y="4" width="10" height="4" fill="#e9e4f5"/><rect x="4" y="3" width="8" height="1" fill="#e9e4f5"/><rect x="4" y="10" width="1" height="2" fill="#7fa6c9"/><rect x="7" y="11" width="1" height="2" fill="#7fa6c9"/><rect x="10" y="10" width="1" height="2" fill="#7fa6c9"/>`,
  storm: `<rect x="3" y="3" width="10" height="4" fill="#a79bb8"/><rect x="4" y="2" width="8" height="1" fill="#a79bb8"/><rect x="7" y="7" width="2" height="2" fill="#eab53f"/><rect x="6" y="9" width="2" height="2" fill="#eab53f"/><rect x="8" y="9" width="2" height="2" fill="#eab53f"/>`,
  snow: `<rect x="3" y="3" width="10" height="4" fill="#e9e4f5"/><rect x="4" y="2" width="8" height="1" fill="#e9e4f5"/><rect x="4" y="10" width="1" height="1" fill="#ffffff"/><rect x="7" y="11" width="1" height="1" fill="#ffffff"/><rect x="10" y="10" width="1" height="1" fill="#ffffff"/><rect x="5" y="12" width="1" height="1" fill="#ffffff"/><rect x="9" y="12" width="1" height="1" fill="#ffffff"/>`,
  fog: `<rect x="2" y="5" width="12" height="1" fill="#cfc8e0"/><rect x="3" y="7" width="10" height="1" fill="#cfc8e0"/><rect x="2" y="9" width="12" height="1" fill="#cfc8e0"/><rect x="4" y="11" width="8" height="1" fill="#cfc8e0"/>`
};

function iconForCode(code){
  if (code === 0) return icons.sun;
  if ([1,2].includes(code)) return icons.partly;
  if (code === 3) return icons.cloud;
  if ([45,48].includes(code)) return icons.fog;
  if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return icons.rain;
  if ([71,73,75,77,85,86].includes(code)) return icons.snow;
  if ([95,96,99].includes(code)) return icons.storm;
  return icons.cloud;
}

function condForCode(code){
  const map = {
    0:'Clear sky', 1:'Mostly clear', 2:'Partly cloudy', 3:'Overcast',
    45:'Foggy', 48:'Foggy',
    51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
    56:'Freezing drizzle', 57:'Freezing drizzle',
    61:'Light rain', 63:'Rain', 65:'Heavy rain',
    66:'Freezing rain', 67:'Freezing rain',
    71:'Light snow', 73:'Snow', 75:'Heavy snow', 77:'Snow grains',
    80:'Rain showers', 81:'Rain showers', 82:'Violent showers',
    85:'Snow showers', 86:'Snow showers',
    95:'Thunderstorm', 96:'Thunderstorm', 99:'Thunderstorm'
  };
  return map[code] || 'Unknown';
}

async function geocode(city){
  const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`);
  const data = await res.json();
  if (!data.results || !data.results.length) throw new Error('City not found');
  const r = data.results[0];
  return { lat:r.latitude, lon:r.longitude, name:r.name, country:r.country_code };
}

async function loadWeather(loc){
  document.getElementById('placeLabel').textContent = `${loc.name}${loc.country ? ', '+loc.country : ''}`;
  document.getElementById('cond').textContent = 'Loading...';
  try{
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto`);
    const data = await res.json();
    const code = data.current.weather_code;
    const temp = Math.round(data.current.temperature_2m);
    const hi = Math.round(data.daily.temperature_2m_max[0]);
    const lo = Math.round(data.daily.temperature_2m_min[0]);
    document.getElementById('temp').textContent = `${temp}°`;
    document.getElementById('cond').textContent = condForCode(code);
    document.getElementById('lohi').textContent = `H:${hi}°  L:${lo}°`;
    document.getElementById('wxIcon').innerHTML = iconForCode(code);
  }catch(e){
    document.getElementById('cond').textContent = 'Could not load weather';
  }
}

async function setCity(city){
  try{
    const loc = await geocode(city);
    safeSet(LOC_KEY, JSON.stringify(loc));
    safeSet(CITY_KEY, city);
    await loadWeather(loc);
  }catch(e){
    document.getElementById('cond').textContent = 'City not found, try again';
  }
}

document.getElementById('placeLabel').addEventListener('click', () => {
  document.getElementById('panel').classList.toggle('open');
});
document.getElementById('saveBtn').addEventListener('click', () => {
  const val = document.getElementById('cityInput').value.trim();
  if (val){ setCity(val); document.getElementById('panel').classList.remove('open'); }
});
document.getElementById('cityInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('saveBtn').click();
});

(async function init(){
  const savedLoc = safeGet(LOC_KEY);
  if (savedLoc){
    await loadWeather(JSON.parse(savedLoc));
  } else {
    await setCity(DEFAULT_CITY);
  }
})();
</script>
</body>
</html>
